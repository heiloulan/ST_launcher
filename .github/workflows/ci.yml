name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - id: runtime-version
        name: Read pinned Node version
        run: echo "node=$(jq -r '.node.version' runtime.lock.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.runtime-version.outputs.node }}
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            runtime/plugin-st-launcher/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/cache@v6
        with:
          path: .cache/runtime
          key: runtime-${{ runner.os }}-${{ hashFiles('runtime.lock.json', 'runtime/**/package-lock.json') }}

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install test dependencies
        run: |
          npm ci --prefix runtime
          npm ci --prefix runtime/plugin-st-launcher
          python -m pip install ruff==0.12.5

      - name: Lint and test runtime sources
        run: |
          npm --prefix runtime run lint
          node --test tests/launcher-plugin.test.mjs
          python -m unittest discover -s tests
          ruff check tools tests
          ruff format --check tools tests

      - name: Build pinned runtime
        run: python tools/build_runtime.py

      - name: Verify Android project
        working-directory: android
        run: |
          ./gradlew \
            :runtime-core:check \
            :app:spotlessCheck \
            :app:testDebugUnitTest \
            :app:compileDebugAndroidTestKotlin \
            :app:lintDebug \
            :app:assembleRelease

      - name: Verify APK release gates
        run: python tools/verify_apk.py android/app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/upload-artifact@v7
        with:
          name: st-launcher-unsigned-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

name: GitHub prerelease

on:
  push:
    tags:
      - "v*-beta*"
      - "v*-rc*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - id: runtime-version
        name: Read pinned Node version
        run: echo "node=$(jq -r '.node.version' runtime.lock.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.runtime-version.outputs.node }}
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            runtime/plugin-st-launcher/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/cache@v6
        with:
          path: .cache/runtime
          key: runtime-${{ runner.os }}-${{ hashFiles('runtime.lock.json', 'runtime/**/package-lock.json') }}

      - name: Build and verify release
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          npm ci --prefix runtime
          npm ci --prefix runtime/plugin-st-launcher
          python -m pip install ruff==0.12.5
          npm --prefix runtime run lint
          node --test tests/launcher-plugin.test.mjs
          python -m unittest discover -s tests
          ruff check tools tests
          ruff format --check tools tests
          python tools/build_runtime.py
          cd android
          ./gradlew \
            :runtime-core:check \
            :app:spotlessCheck \
            :app:testDebugUnitTest \
            :app:compileDebugAndroidTestKotlin \
            :app:lintDebug \
            :app:assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ST_LAUNCHER_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ST_LAUNCHER_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ST_LAUNCHER_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ST_LAUNCHER_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/st-launcher.jks"
          apksigner sign \
            --ks "$RUNNER_TEMP/st-launcher.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "ST-Launcher-${GITHUB_REF_NAME}.apk" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          apksigner verify --verbose "ST-Launcher-${GITHUB_REF_NAME}.apk"
          python tools/verify_apk.py "ST-Launcher-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ST-Launcher-${{ github.ref_name }}.apk
            runtime.lock.json
            runtime/generated/sbom.cdx.json
            runtime/android-assets/THIRD_PARTY_NOTICES.txt
